schema_version: 1

context:
  name: pyodps
  version: "0.13.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyodps-${{ version }}.tar.gz
  sha256: a1ab2433f0de87d5c9a7cdb7f99687e772be54e82ce2100a89e4b3e5b32b723f

build:
  number: 1
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pyou = odps_scripts.pyou:main
      - pyodps-pack = odps_scripts.pyodps_pack:main

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - wheel
        - if: match(python, "<=3.12")
          then: cython >=3.0,<3.1
          else: cython >=3.1,<3.3
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=64
    # yes, wheel is really needed (for python 3.13 at least)
    - wheel
    - numpy >=2.0.0
    - if: not win and match(python, "<=3.12")
      then: cython >=3.0,<3.1
    - if: not win and match(python, ">3.12")
      then: cython >=3.1,<3.3
  run:
    - python
    - requests >=2.4.0
    - pyarrow >=2.0.0

tests:
  - python:
      imports:
        - odps
        - odps_scripts
  - requirements:
      run:
        - pip
    script:
      - pip check
      - pyou --help
      - pyodps-pack --help

about:
  summary: ODPS Python SDK and data analysis framework
  license: MIT AND Apache-2.0
  license_file: License
  homepage: http://github.com/aliyun/aliyun-odps-python-sdk
  repository: http://github.com/aliyun/aliyun-odps-python-sdk

extra:
  recipe-maintainers:
    - xylar
